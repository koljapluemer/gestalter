[package]
name = "gestalts-connector"
description = "The Gestalter's desktop app: makes a folder on this computer the source of truth for the Gestalts web apps"
edition.workspace = true
version.workspace = true

[dependencies]
# the node from a sibling checkout of the gestalts repo, until it is published
gestalts-node = { path = "../../gestalts/crates/node" }
clap = { version = "4", features = ["derive"] }
# the same version as the node's, whose `Embedded` takes these `Dir`s
include_dir = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "links", "accesskit"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
auto-launch = "0.6"
opener = "0.9"

[build-dependencies]
serde_json.workspace = true

# Linux: StatusNotifierItem over D-Bus, so no GTK/appindicator; it runs its own thread, no event loop needed
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# macOS/Windows: the tray needs an event loop on the main thread, which tao provides
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"
tao = "0.37"

[package.metadata.packager]
product-name = "Gestalts Connector"
identifier = "com.koljasam.gestalts.connector"
category = "Productivity"
description = "Keeps your Gestalts notes in a folder on this computer and runs your plugins"
icons = ["assets/icon.png"]
authors = ["Kolja Sam"]
publisher = "Kolja Sam"
before-packaging-command = "cargo build --release -p gestalts-connector"
out-dir = "../target/packages"

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libegl1"]

[package.metadata.generate-rpm]
name = "gestalts-connector"
summary = "Keeps your Gestalts notes in a folder on this computer and runs your plugins"
license = "proprietary"
assets = [
  { source = "../target/release/gestalts-connector", dest = "/usr/bin/gestalts-connector", mode = "755" },
  { source = "assets/gestalts-connector.desktop", dest = "/usr/share/applications/gestalts-connector.desktop", mode = "644" },
  { source = "assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/gestalts-connector.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
mesa-libEGL = "*"
