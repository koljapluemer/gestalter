# The gestalter on the desktop (`id` is its for good: tabs are kept per distribution). `core` plugins are always there;
# `plugins` can be installed and uninstalled. Paths are from this file.
id: gestalter
core:
  - ../../gestalts/plugins/quick-note
  - ../../gestalts/plugins/note-crud
  - ../../gestalts/plugins/note-queue
  - ../../gestalts/plugins/flashcards
plugins:
  - ../../gestalts/plugins/flashcard-manager
  - ../../gestalt-plugins/sam-learns/alphabet-pronunciation-trainer
  - ../../gestalt-plugins/sam-learns/transparent-input
default_views: [quick-note, note-crud, note-queue]
install_ui: true
# views run in the app's origin, so frames they embed (a video player) work; only for our own code, which loads nothing
# from elsewhere at run time
same_origin:
  - transparent-input
