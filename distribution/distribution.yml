default_panes: [explorer/explorer, calendar/daily, calendar/calendar, projects/projects, queue/queue, float/float, questions/questions, canvas/canvas, graph/graph, typst/canvas2typ, sources/sources, learn/learn, quotes/quotes, alphabet-pronunciation-via-visual-cognates/practice, learn-world-map/practice]
install_ui: true
